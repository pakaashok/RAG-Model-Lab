version: '3.8'

services:
  # ================================
  # Ollama - Local LLM
  # ================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # ← Remove health check completely
    # Let rag-app wait using depends_on

  # ================================
  # ChromaDB - Vector Database
  # ================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped
    # ← Remove health check completely

  # ================================
  # RAG App - Streamlit UI
  # ================================
  rag-app:
    build: ./app
    container_name: rag-app
    ports:
      - "8501:8501"
    volumes:
      - ./documents:/app/documents
      - ./vectorstore:/app/vectorstore
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - ollama      # ← Simple depends_on
      - chromadb    # ← No condition needed
    restart: unless-stopped

# ================================
# Volumes
# ================================
volumes:
  ollama_data:
    name: rag_ollama_data
  chroma_data:
    name: rag_chroma_data
    